<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WOTD Solver</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --text-color: #ffffff;
      --primary-gold: #f0b90b;
      --gold-glow: rgba(240, 185, 11, 0.4);
      --green-bg: rgba(14, 203, 129, 0.15);
      --green-border: #0ecb81;
      --yellow-bg: rgba(240, 185, 11, 0.15);
      --yellow-border: #f0b90b;
      --grey-bg: #2b2f36;
      --border-color: #363a45;
      --red-color: #f6465d;
    }

    [data-theme="light"] {
      --bg-color: #f5f5f7;
      --card-bg: #ffffff;
      --text-color: #1e2329;
      --grey-bg: #e6e8ea;
      --border-color: #d0d4dc;
      --green-bg: rgba(14, 203, 129, 0.1);
      --yellow-bg: rgba(240, 185, 11, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      padding: 12px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary-gold);
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .control-panel {
      background: var(--card-bg);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
    }

    select {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      font-weight: bold;
    }

    .status-badge {
      font-size: 0.8rem;
      color: var(--green-border);
      font-weight: 600;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #848e9c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .grid {
      display: grid;
      gap: 6px;
      margin-bottom: 8px;
    }

    .letter-box {
      width: 100%;
      height: 44px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: bold;
      text-transform: uppercase;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
    }

    .green-box {
      background: var(--green-bg);
      border-color: var(--green-border);
      color: var(--green-border);
    }

    .yellow-box {
      background: var(--yellow-bg);
      border-color: var(--yellow-border);
      color: var(--yellow-border);
    }

    .grey-input {
      width: 100%;
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Active Input Highlight */
    .active-box {
      border-color: var(--primary-gold) !important;
      box-shadow: 0 0 0 2px var(--gold-glow) !important;
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 5px;
      user-select: none;
      margin-top: 4px;
    }

    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }

    .key {
      flex: 1;
      height: 42px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .key-action {
      flex: 1.4;
      background: var(--grey-bg);
      font-size: 0.75rem;
    }

    .warning {
      color: var(--red-color);
      font-size: 0.8rem;
      text-align: center;
      display: none;
      font-weight: 600;
    }

    .results-container {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .results-list {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .results-list li {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .results-list li.top-candidate {
      border-color: var(--primary-gold);
    }

    .results-list li.crypto-tag {
      color: var(--primary-gold);
    }

    .load-more-btn {
      width: 100%;
      margin-top: 10px;
      padding: 8px;
      background: var(--grey-bg);
      color: var(--primary-gold);
      border: 1px solid var(--primary-gold);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      text-align: center;
    }

    .badge {
      background: var(--primary-gold);
      color: #000;
      font-size: 0.6rem;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: bold;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary-gold);
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.8rem;
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="title">WOTD Solver</div>
      <div class="header-btns">
        <button class="btn" id="themeBtn" onclick="toggleTheme()">☀️ Light</button>
        <button class="btn" onclick="resetForm()">🔄 Reset</button>
      </div>
    </div>

    <div class="control-panel">
      <div>
        <label for="length" class="section-label" style="margin:0; margin-right:6px;">Length:</label>
        <select id="length" onchange="handleLengthChange()">
          <option value="3">3 Letters</option>
          <option value="4">4 Letters</option>
          <option value="5">5 Letters</option>
          <option value="6" selected>6 Letters</option>
          <option value="7">7 Letters</option>
          <option value="8">8 Letters</option>
        </select>
      </div>
      <div id="status" class="status-badge">● Loading...</div>
    </div>

    <div>
      <div class="section-label">Green Letters (Correct Position)</div>
      <div id="greenGrid" class="grid"></div>
    </div>

    <div>
      <div class="section-label">Yellow Letters (Wrong Position)</div>
      <div id="yellowGrid" class="grid"></div>
    </div>

    <div>
      <div class="section-label">Grey Letters (Excluded)</div>
      <input type="text" id="grey" class="grey-input" placeholder="e.g. A, B, C" inputmode="none" readonly />
    </div>

    <div id="conflictWarning" class="warning">⚠️ Conflict detected between Green and Yellow inputs!</div>

    <div class="keyboard">
      <div class="kb-row" id="kb-row1"></div>
      <div class="kb-row" id="kb-row2"></div>
      <div class="kb-row" id="kb-row3"></div>
    </div>

    <div class="results-container">
      <div class="section-label" id="resultHeading">Candidate Words (0)</div>
      <ul id="results" class="results-list"></ul>
      <button id="loadMoreBtn" class="load-more-btn" onclick="showAllWords()">Show All Words</button>
    </div>
  </div>

  <div id="toast" class="toast">Copied to clipboard!</div>

  <script>
    const baseCryptoWords = [
      "PAY", "NFT", "KYC", "DAO", "GAS", "FAN", "DEX", "TAX", "BUY", "CEX", "BOT", "API", "BTC", "ETH", "SOL", "BNB", "P2P", "POS", "POW", "WEB", "VAL", "APY", "APR", "FEE", "LED", "HUB", "KEY", "BID", "ASK",
      "WEB3", "POOL", "NODE", "GAME", "BOTS", "EARN", "HASH", "GIFT", "VOTE", "DATA", "FUND", "LINK", "COIN", "MINT", "BUSD", "DAPP", "SEED", "HARD", "SOFT", "BULL", "BEAR", "SWAP", "LIST", "FORK", "RISK", "SAFE", "FOLD", "LOCK", "CALL", "SPOT", "SELL", "COST", "KEYS", "GWEI", "BURN", "MAIN", "TEST", "COLD", "WARM", "FIAT", "DEFI", "PERP", "HOLD", "HODL", "ZONE", "FARM", "PAIR", "TEAM", "USER",
      "CHAIN", "SMART", "BLOCK", "TOKEN", "TRADE", "LAYER", "PROOF", "ASSET", "BUILD", "VALUE", "ORDER", "TRUST", "PRICE", "MINER", "MATCH", "SHIB", "DOGE", "STORE", "SHARD", "INDEX", "UTXO", "YIELD", "CHART", "NODES", "SCALE", "FRAUD", "LIMIT", "MAKER", "TAKER", "RALLY", "STAKE", "ROYAL", "SWAPS", "TRACK", "AUDIT", "MERGE", "POWER", "STATE", "SPEED", "ENTRY", "TREND", "VAULT", "GRANT", "MODEL", "SALES", "GUEST",
      "WALLET", "CRYPTO", "SAFETY", "REWARD", "MINING", "SECURE", "VERIFY", "BRIDGE", "SERVER", "MARKET", "SIGNAL", "REDUCE", "ACTION", "SYSTEM", "ORACLE", "SENDER", "BLOCKS", "PUBLIC", "PHISH", "ACCESS", "SEARCH", "TICKET", "LAUNCH", "INSURE", "PLEDGE", "INVEST", "PROFIT", "LOSSES", "BORDER", "REASON", "RETAIL", "NFTMAN", "AVATAR", "EVMNET", "ACTIVE", "MOBILE", "STABLE", "FUTURE", "MARGIN", "LIQUID", "BOUNTY", "DOLLAR", "LEGACY", "DOMAIN", "AUTHOR", "ONLINE", "AGENTS",
      "DEPOSIT", "NETWORK", "STAKING", "ACCOUNT", "PROJECT", "FINANCE", "PAYMENT", "CONNECT", "TRADING", "RESERVE", "RESTORE", "PROTECT", "UPGRADE", "VOUCHER", "PRIVACY", "SCAMMER", "FREEDOM", "ANALYZE", "DIGITAL", "AUDITING", "UTILITY", "HASHING", "ROUTING", "ADOPTED", "AIRDROP", "BITCOIN", "VIRTUAL", "DYNAMIC", "PREDICT", "MONITOR", "PARTNER", "OFFLINE", "PERCENT", "SUMMARY", "DEVELOP", "FUTURES", "RECOVER", "DISCUSS", "CREATOR", "HOLDING", "WALLETS",
      "SECURITY", "SOLUTION", "IDENTITY", "PROTOCOL", "PLATFORM", "TRANSFER", "AUTOMATE", "CONTRACT", "RESEARCH", "CHARGING", "OVERVIEW", "STRATEGY", "HARDWARE", "SOFTWARE", "EXCHANGE", "VALIDATE", "DATABASE", "MERCHANT", "CUSTODY", "DISCOVER", "PRACTICE", "BLOCKCHAIN", "TRANSACT", "INTERNET", "EVALUATE", "PHYSICAL", "LOCKEDIN", "OPTIMIZE", "GENERATE", "FIGHTING", "FEEDBACK", "RESOURCE", "ACADEMY"
    ];

    const cryptoSet = new Set(baseCryptoWords);
    let dictionaryByLength = {};
    let currentActiveInput = null;
    let currentRankedMatches = [];
    let displayLimit = 100;

    function setActiveInput(el) {
      document.querySelectorAll('input').forEach(i => i.classList.remove('active-box'));
      currentActiveInput = el;
      if (el) {
        el.classList.add('active-box');
      }
    }

    function buildDictionaryIndex(wordsList) {
      dictionaryByLength = {};
      for (let i = 0; i < wordsList.length; i++) {
        const w = wordsList[i];
        const len = w.length;
        if (!dictionaryByLength[len]) dictionaryByLength[len] = [];
        dictionaryByLength[len].push(w);
      }
    }

    window.onload = async function() {
      initKeyboard();
      loadTheme();
      setupBoxes();

      const greyInput = document.getElementById('grey');
      const bindGreyFocus = (e) => setActiveInput(e.target);
      greyInput.addEventListener('focus', bindGreyFocus);
      greyInput.addEventListener('click', bindGreyFocus);
      greyInput.addEventListener('touchstart', bindGreyFocus);

      loadState();
      
      const statusDiv = document.getElementById('status');
      try {
        const response = await fetch('https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt');
        if (!response.ok) throw new Error("Fetch Error");
        
        const textData = await response.text();
        const onlineWords = textData.split(/\r?\n/);
        
        const wordSet = new Set(baseCryptoWords);
        for (let i = 0; i < onlineWords.length; i++) {
          const cleanWord = onlineWords[i].trim().toUpperCase();
          if (cleanWord) wordSet.add(cleanWord);
        }
        
        const fullList = Array.from(wordSet);
        buildDictionaryIndex(fullList);
        statusDiv.textContent = `● Active (${fullList.length.toLocaleString()} Words)`;
      } catch (err) {
        buildDictionaryIndex(baseCryptoWords);
        statusDiv.textContent = `● Offline Mode (${baseCryptoWords.length} Crypto Words)`;
        statusDiv.style.color = "var(--primary-gold)";
      }
      findWords();
    };

    function handleLengthChange() {
      setupBoxes();
      saveState();
      findWords();
    }

    function setupBoxes() {
      const len = parseInt(document.getElementById('length').value, 10);
      const greenGrid = document.getElementById('greenGrid');
      const yellowGrid = document.getElementById('yellowGrid');
      
      greenGrid.style.gridTemplateColumns = `repeat(${len}, 1fr)`;
      yellowGrid.style.gridTemplateColumns = `repeat(${len}, 1fr)`;

      greenGrid.innerHTML = '';
      yellowGrid.innerHTML = '';

      for (let i = 0; i < len; i++) {
        greenGrid.appendChild(createBox('green-box', i, 1));
        yellowGrid.appendChild(createBox('yellow-box', i, 5));
      }
      setActiveInput(document.getElementById('grey'));
    }

    function createBox(className, index, maxLen) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = maxLen;
      input.className = `letter-box ${className}`;
      input.dataset.index = index;
      input.autocomplete = 'off';
      input.autocorrect = 'off';
      input.autocapitalize = 'characters';
      input.setAttribute('inputmode', 'none');
      input.readOnly = true;

      const handleFocus = (e) => {
        setActiveInput(e.target);
      };

      input.addEventListener('focus', handleFocus);
      input.addEventListener('click', handleFocus);
      input.addEventListener('touchstart', handleFocus);

      return input;
    }

    function initKeyboard() {
      const rows = [
        ["Q","W","E","R","T","Y","U","I","O","P"],
        ["A","S","D","F","G","H","J","K","L"],
        ["Z","X","C","V","B","N","M"]
      ];
      rows.forEach((row, idx) => {
        const rowDiv = document.getElementById(`kb-row${idx+1}`);
        row.forEach(key => {
          const btn = document.createElement('div');
          btn.className = 'key';
          btn.textContent = key;
          btn.onclick = () => handleKeyPress(key);
          rowDiv.appendChild(btn);
        });

        if (idx === 2) {
          const backBtn = document.createElement('div');
          backBtn.className = 'key key-action';
          backBtn.textContent = '⌫';
          backBtn.onclick = removeLastGreyLetter;
          rowDiv.appendChild(backBtn);

          const clearBtn = document.createElement('div');
          clearBtn.className = 'key key-action';
          clearBtn.textContent = 'CLR';
          clearBtn.onclick = clearGreyLetters;
          rowDiv.prepend(clearBtn);
        }
      });
    }

    function handleKeyPress(char) {
      if (!currentActiveInput) {
        setActiveInput(document.getElementById('grey'));
      }

      const el = currentActiveInput;

      if (el.classList.contains('letter-box')) {
        const maxLen = parseInt(el.maxLength, 10);
        if (maxLen === 1) { // Green Box
          el.value = char;
          const next = el.nextElementSibling;
          if (next) {
            setActiveInput(next);
          }
        } else { // Yellow Box
          if (el.value.length < maxLen && !el.value.includes(char)) {
            el.value += char;
          }
        }
      } else if (el.id === 'grey') { // Grey Box
        let raw = el.value.toUpperCase().replace(/[^A-Z]/g, '');
        let letters = new Set(raw.split('').filter(Boolean));
        letters.add(char);
        el.value = Array.from(letters).join(', ');
      }

      saveState();
      findWords();
    }

    function removeLastGreyLetter() {
      if (!currentActiveInput) setActiveInput(document.getElementById('grey'));
      const el = currentActiveInput;

      if (el.classList.contains('letter-box')) {
        if (el.value.length > 0) {
          el.value = el.value.slice(0, -1);
        } else {
          const prev = el.previousElementSibling;
          if (prev) {
            setActiveInput(prev);
            prev.value = prev.value.slice(0, -1);
          }
        }
      } else if (el.id === 'grey') {
        let raw = el.value.toUpperCase().replace(/[^A-Z]/g, '');
        let letters = raw.split('').filter(Boolean);
        letters.pop();
        el.value = letters.join(', ');
      }

      saveState();
      findWords();
    }

    function clearGreyLetters() {
      if (currentActiveInput && currentActiveInput.classList.contains('letter-box')) {
        currentActiveInput.value = '';
      } else {
        const greyEl = document.getElementById('grey');
        greyEl.value = '';
        setActiveInput(greyEl);
      }
      saveState();
      findWords();
    }

    function rankWordsPredictably(matches) {
      if (matches.length === 0) return [];

      const len = matches[0].length;
      const freqMap = Array.from({ length: len }, () => ({}));
      
      matches.forEach(word => {
        for (let i = 0; i < len; i++) {
          const char = word[i];
          freqMap[i][char] = (freqMap[i][char] || 0) + 1;
        }
      });

      return matches.map(word => {
        let score = 0;
        const seenChars = new Set();

        for (let i = 0; i < len; i++) {
          const char = word[i];
          score += freqMap[i][char] || 0;
          
          if (!seenChars.has(char)) {
            score += (matches.length * 0.2); 
            seenChars.add(char);
          }
        }

        if (cryptoSet.has(word)) {
          score += (matches.length * 2.0) + 500;
        }

        return { word, score };
      })
      .sort((a, b) => b.score - a.score)
      .map(item => item.word);
    }

    function findWords() {
      displayLimit = 100;
      const len = parseInt(document.getElementById('length').value, 10);
      const greenInputs = document.querySelectorAll('.green-box');
      const yellowInputs = document.querySelectorAll('.yellow-box');
      const greyRaw = document.getElementById('grey').value.toUpperCase().replace(/[^A-Z]/g, '');
      const greyLetters = new Set(greyRaw.split(''));
      
      const warningDiv = document.getElementById('conflictWarning');
      warningDiv.style.display = 'none';

      const greenPattern = Array.from(greenInputs).map(i => i.value.toUpperCase() || '.');
      const yellowPatterns = Array.from(yellowInputs).map(i => i.value.toUpperCase().split(''));

      let conflict = false;
      for (let i = 0; i < len; i++) {
        if (greenPattern[i] !== '.' && yellowPatterns[i].includes(greenPattern[i])) {
          conflict = true; break;
        }
      }
      if (conflict) warningDiv.style.display = 'block';

      const minCharCounts = {};
      for (let i = 0; i < len; i++) {
        if (greenPattern[i] !== '.') {
          const c = greenPattern[i];
          minCharCounts[c] = (minCharCounts[c] || 0) + 1;
        }
        yellowPatterns[i].forEach(c => {
          minCharCounts[c] = Math.max(minCharCounts[c] || 0, 1);
        });
      }

      const candidateWords = dictionaryByLength[len] || [];

      const matches = candidateWords.filter(word => {
        for (let i = 0; i < len; i++) {
          if (greenPattern[i] !== '.' && greenPattern[i] !== word[i]) return false;
        }

        for (let i = 0; i < len; i++) {
          if (yellowPatterns[i].includes(word[i])) return false;
        }

        for (const [char, reqCount] of Object.entries(minCharCounts)) {
          let count = 0;
          for (let i = 0; i < len; i++) { if (word[i] === char) count++; }
          if (count < reqCount) return false;
        }

        for (let i = 0; i < len; i++) {
          const char = word[i];
          if (greyLetters.has(char)) {
            const maxAllowed = minCharCounts[char] || 0;
            let count = 0;
            for (let j = 0; j < len; j++) { if (word[j] === char) count++; }
            if (count > maxAllowed) return false;
          }
        }

        return true;
      });

      currentRankedMatches = rankWordsPredictably(matches);
      renderResults();
    }

    function renderResults() {
      const list = document.getElementById('results');
      const loadMoreBtn = document.getElementById('loadMoreBtn');
      list.innerHTML = '';

      document.getElementById('resultHeading').textContent = `Candidate Words (${currentRankedMatches.length.toLocaleString()})`;

      if (currentRankedMatches.length === 0) {
        list.innerHTML = '<li style="color:var(--red-color); width:100%; justify-content:center;">No matching words found</li>';
        loadMoreBtn.style.display = 'none';
        return;
      }

      const visibleList = currentRankedMatches.slice(0, displayLimit);
      const fragment = document.createDocumentFragment();

      visibleList.forEach((w, index) => {
        const li = document.createElement('li');
        const isCrypto = cryptoSet.has(w);
        li.textContent = w;
        
        if (index === 0) {
          li.classList.add('top-candidate');
        }
        
        if (isCrypto) {
          li.classList.add('crypto-tag');
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = 'CRYPTO';
          li.appendChild(badge);
        }
        li.onclick = () => copyToClipboard(w);
        fragment.appendChild(li);
      });

      list.appendChild(fragment);

      if (currentRankedMatches.length > displayLimit) {
        const remaining = currentRankedMatches.length - displayLimit;
        loadMoreBtn.textContent = `Show All (${remaining.toLocaleString()} more words)`;
        loadMoreBtn.style.display = 'block';
      } else {
        loadMoreBtn.style.display = 'none';
      }
    }

    function showAllWords() {
      displayLimit = currentRankedMatches.length;
      renderResults();
    }

    function copyToClipboard(text) {
      navigator.clipboard.writeText(text).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        setTimeout(() => toast.style.display = 'none', 1400);
      });
    }

    function resetForm() {
      document.getElementById('grey').value = '';
      document.getElementById('conflictWarning').style.display = 'none';
      document.getElementById('results').innerHTML = '';
      setupBoxes();
      localStorage.removeItem('wotd_state');
      findWords();
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', target);
      document.getElementById('themeBtn').textContent = target === 'light' ? '☀️ Light' : '🌙 Dark';
      localStorage.setItem('wotd_theme', target);
    }

    function loadTheme() {
      const saved = localStorage.getItem('wotd_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('themeBtn').textContent = saved === 'light' ? '☀️ Light' : '🌙 Dark';
    }

    function saveState() {
      const len = document.getElementById('length').value;
      const green = Array.from(document.querySelectorAll('.green-box')).map(i => i.value);
      const yellow = Array.from(document.querySelectorAll('.yellow-box')).map(i => i.value);
      const grey = document.getElementById('grey').value;

      localStorage.setItem('wotd_state', JSON.stringify({ len, green, yellow, grey }));
    }

    function loadState() {
      const data = JSON.parse(localStorage.getItem('wotd_state'));
      if (!data) return;

      document.getElementById('length').value = data.len;
      setupBoxes();

      const greenBoxes = document.querySelectorAll('.green-box');
      const yellowBoxes = document.querySelectorAll('.yellow-box');

      data.green.forEach((v, i) => { if (greenBoxes[i]) greenBoxes[i].value = v; });
      data.yellow.forEach((v, i) => { if (yellowBoxes[i]) yellowBoxes[i].value = v; });
      document.getElementById('grey').value = data.grey || '';
    }
  </script>
</body>
</html>
